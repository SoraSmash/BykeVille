<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo Utente - Bici Ville</title>
</head>

<body>

  <!--da trovare gli users e poi fare il resto-->
  <div class="container">

    <h2 class="text-center">User Profile</h2>

    <div *ngIf="users; else loading" class="profile-container">

      <div *ngFor="let user of users" class="user-card">
        <img src="https://img.icons8.com/?size=100&id=npKPWVoztiss&format=png&color=000000" alt="User Avatar">
        <h2>{{user.firstName}} {{ user.lastName}}</h2>

        <div class="info-label">
          <label for="email" class="form-label"><strong>Email:</strong></label>
          <input type="email" [(ngModel)]="user.emailAddress" class="form-control" id="email">

        </div>

        <div class="info-label">
          <label for="phone" class="form-label"><strong>Phone:</strong></label>
          <input type="text" [(ngModel)]="user.phone" class="form-control" id="phone">
        </div>



        <div class="info-label">
          <label for="company" class="form-label"><strong>Company:</strong></label>
          <input type="text" [(ngModel)]="user.companyName" class="form-control" id="company">
        </div>




        <div class="actions">
          <button class="BVbutton" (click)="saveChanges(user)">Save</button>
          <button class="BVbutton" (click)="openPopup()">Change Password</button>
          <button class="BVbutton cancel" (click)="cancelChanges()">Cancel</button>


        </div>



        <!-- Popup per cambiare la password -->
        <div *ngIf="isOpen" class="popup-container">

          <div class="popup-content">

            <h3>Change Password</h3>

            <form (ngSubmit)="onSubmit()">

              <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" [(ngModel)]="currentPassword" name="currentPassword" class="form-control"
                  id="currentPassword" required>
              </div>

              <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" [(ngModel)]="newPassword" name="newPassword" class="form-control"
                  id="newPassword" required>
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control"
                  id="confirmPassword" required>
              </div>

              <div class="form-group">
                <div class="actions">
                <button type="submit" class="BVbutton">Save</button>
                <button type="button" (click)="closePopup()" class="BVbutton cancel">Cancel</button>
              </div>
              </div>
            </form>
          </div>
        </div>




      </div>
    </div>



    <ng-template #loading>
      <div class="loading">Loading user data...</div>
    </ng-template>
  </div>

</body>

</html>
